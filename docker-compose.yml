services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: qitaa
      POSTGRES_PASSWORD: qitaa
      POSTGRES_DB: qitaa
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qitaa"]
      interval: 5s
      retries: 10

  # Object store for PMTiles archives and listing media. In production this is
  # S3 or Cloudflare R2 behind a CDN — PMTiles is served with HTTP range
  # requests, so no tile server process is required.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Realtime fan-out for community chat + offering-fill counters.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
  miniodata:
